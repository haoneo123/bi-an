<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨鉴 | 仓位风险计算</title>
    <style>
        :root {
            --primary: #c084fc;
            --primary-dark: #7c3aed;
            --bg-deep: #030303;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text);
            font-family: "Inter", "PingFang SC", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 继承：动态流动背景 */
        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 10% 10%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(192, 132, 252, 0.1) 0%, transparent 40%);
            z-index: 0;
            filter: blur(80px);
            animation: pulse 10s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        .container {
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            margin-left: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px 20px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .result-area {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.1), rgba(124, 58, 237, 0.05));
            border-radius: 24px;
            border: 1px solid rgba(192, 132, 252, 0.2);
            text-align: center;
        }

        .result-label {
            font-size: 13px;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .result-value {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(45deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
    <div class="card">
        <h1>风险仓位计算</h1>
        
        <div class="input-group">
            <label>预计亏损金额 (Loss Amount)</label>
            <input type="number" id="lossAmount" placeholder="请输入金额" oninput="calculate()">
        </div>

        <div class="input-group">
            <label>止损比例 (Stop Loss %)</label>
            <input type="number" id="lossPercent" placeholder="例如: 5" oninput="calculate()">
        </div>

        <div class="result-area">
            <div class="result-label">建议实际仓位 (Position Size)</div>
            <div class="result-value" id="positionDisplay">0.00</div>
        </div>

        <div class="footer">
            <p>© 2025 MOJIAN RESEARCH</p>
            <p style="margin-top:5px; opacity:0.4">风控是交易的第一生命线</p>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const amount = parseFloat(document.getElementById('lossAmount').value);
        const percent = parseFloat(document.getElementById('lossPercent').value);
        const display = document.getElementById('positionDisplay');

        if (amount > 0 && percent > 0) {
            // 公式：金额 / (百分比 / 100)
            const result = amount / (percent / 100);
            display.innerText = result.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        } else {
            display.innerText = "0.00";
        }
    }
</script>

</body>
</html>
